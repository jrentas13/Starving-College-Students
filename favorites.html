<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SCS Cookbook - Favorites</title>

<link rel="icon" type="image/x-icon" href="/images/SCS_Logo.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css">
<link rel="stylesheet" href="styles/style.css">
<link rel="stylesheet" href="styles/favorites.css">

<script src="javascript/HeaderFooter.js" defer></script>
<script src="javascript/favorite.js" defer></script>

</head>

<body>

<header></header>

<main class="favorites-container">
    
    <aside class="filter-sidebar">
        <h3>Filter Recipes</h3>
        
        <div class="filter-group">
            <label>Meal Type</label>
            <select id="tag-filter">
                <option value="all">All Tags</option>
                <option value="breakfast">Breakfast</option>
                <option value="lunch">Lunch</option>
                <option value="dinner">Dinner</option>
                <option value="dinner">Dinner</option>
                <option value="dinner">Dinner</option>
                <option value="dinner">Dinner</option>
                <option value="dinner">Dinner</option>
                <option value="dinner">Dinner</option>
                <option value="dinner">Dinner</option>
                <option value="dinner">Dinner</option>
            </select>
        </div>

        <div class="filter-group">
            <label>Max Price</label>
            <input type="range" id="price-filter" min="5" max="50" step="5" value="50">
            <span id="price-value">$50</span>
        </div>

        <div class="filter-group">
            <label>Max Time</label>
            <select id="time-filter">
                <option value="all">Any Time</option>
                <option value="15">15 mins</option>
                <option value="30">30 mins</option>
                <option value="60">60+ mins</option>
            </select>
        </div>
        <button id="reset-filters">Reset Filters</button>
    </aside>

    <div class="main-content-area">
        <section>
            <h1>Favorite Recipes</h1>
            <h2>❤️ Liked Recipes</h2>
            <div id="liked-grid" class="favorites-grid"></div>
        </section>

        <section>
            <h2>All Recipes</h2>
            <div id="favorite-grid" class="favorites-grid">
                <div class="favorite-card" data-tag="dinner" data-price="15" data-time="30">
                    <button class="like-btn">🤍</button>
                    <img src="images/chicken.png" alt="Grilled Chicken">
                    <h3>Grilled Chicken</h3>
                </div>
                </div>
        </section>
    </div>
</main>

<footer></footer>

</body>
</html>
