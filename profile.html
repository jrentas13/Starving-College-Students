<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCS Cookbook - Profile</title>
    <link rel="icon" type="image/x-icon" href="/images/SCS_Logo.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css">
    <link rel="stylesheet" href="styles/style.css">
    <link rel="stylesheet" href="styles/profile.css">
    <script src="javascript/HeaderFooter.js" defer></script>
    <script src="javascript/auth.js" defer></script>
</head>
<body>
    <header></header>

    <main class="profile-page">
        <section class="profile-layout">
            <div class="profile-sidebar">
                <div class="profile-image-wrap">
                    <img src="images/Cartoon-ish_Chef.png" alt="Profile Picture">
                </div>

                <h1 class="profile-username">User Name</h1>
                <p class="member-role">Cookbook Member</p>

                <button class="primary-button" type="button">Edit Profile</button>
            </div>

            <div class="profile-main">
                <div class="profile-header">
                    <h2>Account Information</h2>
                </div>

                <div class="info-grid">
                    <div class="info-card">
                        <span class="info-label">Username</span>
                        <p class="info-value info-username">sample_user</p>
                    </div>

                    <div class="info-card">
                        <span class="info-label">Email</span>
                        <p class="info-value info-email">sample@email.com</p>
                    </div>

                    <div class="info-card">
                        <span class="info-label">Favorite Recipe</span>
                        <p class="info-value info-favorite">Grilled Chicken</p>
                    </div>

                    <div class="info-card">
                        <span class="info-label">Saved Recipes</span>
                        <p class="info-value info-saved">0</p>
                    </div>

                    <div class="info-card full-width">
                        <span class="info-label">Bio</span>
                        <p class="info-value info-bio">
                            Welcome to SCS Cookbook!
                        </p>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer></footer>
</body>
</html>
