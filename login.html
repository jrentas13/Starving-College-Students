<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SCS Cookbook - Log In</title>

  <link rel="icon" type="image/x-icon" href="/images/Cartoon-ish_Chef.png" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css" />
  <link rel="stylesheet" href="styles/style.css" />
  <link rel="stylesheet" href="styles/auth.css" />
  <script src="javascript/HeaderFooter.js" defer></script>
</head>

<body class="auth-page">

  <header></header>

  <main class="auth-main">
    <div class="auth-container">

      <h1 class="auth-title">Log In</h1>
      <p class="auth-subtitle">
        Log in to your existing account to access all features of the SCS Cookbook
      </p>

      <form class="auth-form">

        <div class="auth-field">
          <label class="auth-label" for="username">Username</label>
          <input class="auth-input" type="text" id="username" name="username" placeholder="Username" required />
        </div>

        <div class="auth-field">
          <label class="auth-label" for="password">Password</label>
          <input class="auth-input" type="password" id="password" name="password" placeholder="Password" required />
        </div>

        <button class="auth-button" type="submit">Log In</button>

      </form>

    </div>
  </main>

  <footer></footer>

</body>

</html>
