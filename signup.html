<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SCS Cookbook - Sign Up</title>
  <link rel="icon" type="image/x-icon" href="/images/SCS_Logo.png" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css" />
  <link rel="stylesheet" href="styles/style.css" />
  <link rel="stylesheet" href="styles/auth.css" />
  <script src="javascript/HeaderFooter.js" defer></script>
  <script src="javascript/auth.js" defer></script>
</head>
<body class="auth-page">
  <header></header>

  <main class="auth-main">
    <div class="auth-container">
      <h1 class="auth-title">Sign Up</h1>

      <form class="auth-form signup-form">
        <div class="auth-field">
          <label class="auth-label" for="signup-username">Username</label>
          <input class="auth-input" type="text" id="signup-username" name="username" placeholder="Username" required />
        </div>

        <div class="auth-field">
          <label class="auth-label" for="signup-email">Email</label>
          <input class="auth-input" type="email" id="signup-email" name="email" placeholder="Email" required />
        </div>

        <div class="auth-field">
          <label class="auth-label" for="signup-password">Password</label>
          <input class="auth-input" type="password" id="signup-password" name="password" placeholder="Password" required />
        </div>

        <button class="auth-button" type="submit">Sign Up</button>
      </form>

      <p class="auth-legal">
        By signing up, you agree to our Terms of Service and Privacy Policy.
      </p>
    </div>
  </main>

  <footer></footer>
</body>
</html>
