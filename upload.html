<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCS Cookbook - Upload</title>

    <link rel="icon" type="image/x-icon" href="/images/SCS_Logo.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css">
    <link rel="stylesheet" href="styles/style.css">
    <link rel="stylesheet" href="styles/upload.css">

    <script src="javascript/HeaderFooter.js" defer></script>
    <script src="javascript/upload.js" defer></script>
</head>

<body>

<header></header>

<form>

    <div id="top-container">

        <div id="top-container-info">

            <!-- Recipe Name -->
            <input type="text" id="fname" name="fname" placeholder="Recipe Name" required>

            <!-- Basic Info -->
            <div id="recipe-basic-info">

                <div>
                    <label for="servings">Servings:</label>
                    <input type="text" id="servings" name="servings" placeholder="Serving size" required>
                </div>

                <div>
                    <label for="time">Total Time:</label>
                    <select id="time" name="time" required>
                        <option value="">Select Time</option>
                        <option value="15">15 mins</option>
                        <option value="30">30 mins</option>
                        <option value="45">45 mins</option>
                        <option value="60">1 hour</option>
                        <option value="75">1 hr 15 mins</option>
                        <option value="90">1 hr 30 mins</option>
                        <option value="105">1 hr 45 mins</option>
                        <option value="120">2 hours</option>
                        <option value="180">3 hours</option>
                        <option value="240">4 hours</option>
                        <option value="300">5 hours</option>
                        <option value="360">6 hours</option>
                        <option value="420">7 hours</option>
                        <option value="480">8 hours</option>
                    </select>
                </div>

            </div>
        </div>

        <!-- Image Upload -->
        <div id="image-upload-section">

            <label for="image">Upload Recipe Image:</label>
            <input type="file" id="image" name="image" accept="image/*">

            <!-- Preview -->
            <img id="image-preview" src="images/chicken.png" alt="Preview">

        </div>

    </div>

    <!-- Ingredients -->
    <div>
        <label>(Ingredients Form)</label>
    </div>

    <!-- Description -->
    <div id="recipe-description">
        <label for="description">Description:</label>
        <textarea id="description" name="description" placeholder="Type your text here..."></textarea>
    </div>

    <!-- Tags -->
    <div id="recipe-tags">
        <label for="tags">Tags:</label>
        <select id="tags" name="tags" required>

            <option value="">Select a tag</option>

            <option value="breakfast">Breakfast</option>
            <option value="lunch">Lunch</option>
            <option value="dinner">Dinner</option>
            <option value="family-meal">Family Meal</option>

            <option value="italian">Italian</option>
            <option value="mexican">Mexican</option>
            <option value="asian">Asian</option>
            <option value="mediterranean">Mediterranean</option>

            <option value="main">Main Course</option>
            <option value="side">Side Dish</option>
            <option value="dessert">Desserts</option>
            <option value="snack">Snacks</option>

        </select>

        <button id="submit-button" class="submit" type="button">
            Submit Recipe
        </button>
    </div>

</form>

<footer></footer>

</body>
</html>
