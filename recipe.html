<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCS Cookbook - Recipe</title>
    <link rel="icon" type="image/x-icon" href="/images/Cartoon-ish_Chef.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css">
    <link rel="stylesheet" href="styles/style.css">
    <link rel="stylesheet" href="styles/homepage.css">
    <link rel="stylesheet" href="styles/recipe.css">

    <script src="javascript/HeaderFooter.js" defer></script>
    <script src="javascript/recipepage.js" defer></script>
</head>
<body>

<header></header>

<main class="recipe-page">

    <section id="top-container">
        <div id="top-container-info">

            <div class="title-row">
                <h1>Recipe Title</h1>
                <button class="like-btn" aria-label="Favorite recipe">🤍</button>
            </div>

            <div id="recipe-owner">
                <p><strong>By:</strong> Author Name</p>
            </div>

            <div id="recipe-basic-info">
                <p><strong>Prep:</strong> Time</p>
                <p><strong>Cook:</strong> Time</p>
                <p><strong>Serves:</strong> Amount</p>
            </div>

            <div id="recipe-description">
                <p>Short description of the recipe.</p>
            </div>

            <div class="button-row">
                <button id="print-button" type="button">Print</button>
                <button id="save-button" type="button">Save</button>
            </div>

        </div>

        <div class="recipe-image-box">
            <img src="images/chicken.png" alt="Recipe Image">
        </div>
    </section>

    <section id="ingredients-box">
        <h2>Ingredients</h2>
        <ul>
            <li>Ingredient 1</li>
            <li>Ingredient 2</li>
            <li>Ingredient 3</li>
        </ul>
    </section>

    <section id="instructions-box">
        <h2>Instructions</h2>
        <ol>
            <li>Step 1</li>
            <li>Step 2</li>
            <li>Step 3</li>
        </ol>
    </section>

    <section id="tags">
        <h2>Tags</h2>
        <div class="tag-list">
            <p>Tag</p>
            <p>Tag</p>
            <p>Tag</p>
        </div>
    </section>

</main>

<footer></footer>

</body>
</html>
